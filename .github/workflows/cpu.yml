name: CPU contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: CUDA_VISIBLE_DEVICES= python -m scripts.hotpaths.check
      - run: python -m compileall -q launch.py scripts adaptation config tests
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.check_runtime import expected_sources

          root = Path(".")
          expected_sources(root)
          for path in sorted(root.rglob("*.json")):
              if ".git" not in path.parts and "runtime" not in path.parts:
                  json.loads(path.read_text())
          PY
